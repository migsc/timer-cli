name: Tests

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.10'
          - os: ubuntu-latest
            python: '3.14'
          - os: macos-15-intel
            python: '3.10'
          - os: macos-15
            python: '3.14'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Build source distribution and wheel
        run: |
          python -m pip install build
          python -m build
      - name: Install wheel
        run: python -m pip install dist/*.whl
      - name: Test installed package outside the checkout
        working-directory: ${{ runner.temp }}
        run: |
          python -m unittest discover -s "$GITHUB_WORKSPACE/tests" -v
          timer --version
          timer --help
